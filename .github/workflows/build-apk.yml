name: Build APK

on:
  push:
    branches:
      - claude/usb-keyboard-android-mapping-3v471y
      - claude/key-release-timing-9k0dyr
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jonnyskeys-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jonnyskeys.apk
          gh release create apk-latest \
            --title "Jonnyskeys APK (latest build)" \
            --notes "Debug-signed APK built from ${{ github.sha }}. Download jonnyskeys.apk below, copy it to your phone, and install it (allow installs from unknown sources)." \
            --target "${{ github.sha }}" || true
          gh release upload apk-latest jonnyskeys.apk --clobber

  play-bundle:
    # Builds the signed .aab for Google Play. Runs only once the signing
    # secrets are configured in the repo settings (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; skipping Play bundle."
          fi
          if [ -n "$PLAY_SA" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "Play service account not configured; skipping Play upload."
          fi

      - name: Set up JDK 17
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.secrets.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.secrets.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release bundle
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jonnyskeys-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (internal testing track)
        # Runs only after the app exists in Play Console and a service
        # account key is stored as the PLAY_SERVICE_ACCOUNT_JSON secret.
        # The very first .aab must be uploaded by hand in the Console;
        # after that, every push deploys here automatically.
        if: steps.secrets.outputs.present == 'true' && steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jonnyskeys.keytap
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
