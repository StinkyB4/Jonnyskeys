name: Build APK

on:
  push:
    branches:
      - claude/usb-keyboard-android-mapping-3v471y
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jonnyskeys-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jonnyskeys.apk
          gh release create apk-latest \
            --title "Jonnyskeys APK (latest build)" \
            --notes "Debug-signed APK built from ${{ github.sha }}. Download jonnyskeys.apk below, copy it to your phone, and install it (allow installs from unknown sources)." \
            --target "${{ github.sha }}" || true
          gh release upload apk-latest jonnyskeys.apk --clobber
